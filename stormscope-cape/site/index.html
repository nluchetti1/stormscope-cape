<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StormScope · Cape Canaveral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1419; --panel:#161E26; --panel-2:#1C262F;
  --line:#263340; --ink:#DCE5EC; --dim:#7B8B9A;
  --signal:#FF9E1B; --signal-dim:#8A5A14; --cyan:#4FC3D9;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column;overflow:hidden;
}

/* ---------- header ---------- */
header{
  display:flex;align-items:baseline;gap:1.25rem;flex-wrap:wrap;
  padding:.7rem 1.1rem;border-bottom:1px solid var(--line);background:var(--panel);
}
h1{
  font-family:var(--cond);font-weight:700;font-size:1.05rem;margin:0;
  letter-spacing:.14em;text-transform:uppercase;
}
h1 span{color:var(--signal)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--dim);letter-spacing:.04em}
.spacer{flex:1}
select{
  font-family:var(--mono);font-size:.78rem;background:var(--panel-2);
  color:var(--ink);border:1px solid var(--line);border-radius:2px;
  padding:.35rem .55rem;
}
select:focus-visible{outline:2px solid var(--signal);outline-offset:1px}

/* ---------- body ---------- */
main{flex:1;display:flex;min-height:0}
aside{
  width:16rem;flex-shrink:0;border-right:1px solid var(--line);
  background:var(--panel);overflow-y:auto;padding:.9rem 0;
}
.eyebrow{
  font-family:var(--cond);font-size:.66rem;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dim);padding:0 1.1rem .5rem;
}
.varlist{list-style:none;margin:0 0 1.4rem;padding:0}
.varlist button{
  width:100%;text-align:left;background:none;border:0;cursor:pointer;
  color:var(--dim);font-family:var(--sans);font-size:.82rem;
  padding:.42rem 1.1rem .42rem .85rem;border-left:3px solid transparent;
  display:block;line-height:1.3;
}
.varlist button:hover{color:var(--ink);background:var(--panel-2)}
.varlist button[aria-current="true"]{
  color:var(--ink);border-left-color:var(--signal);background:var(--panel-2);
  font-weight:500;
}
.varlist button:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.variants{display:flex;flex-wrap:wrap;gap:3px;padding:.15rem 1.1rem 1.1rem}
.variants button{
  background:var(--panel-2);border:1px solid var(--line);color:var(--dim);
  font-family:var(--mono);font-size:.68rem;padding:.28rem .5rem;
  border-radius:2px;cursor:pointer;min-width:2.5rem;
}
.variants button:hover{color:var(--ink);border-color:#3A4B58}
.variants button[aria-current="true"]{
  background:var(--signal);border-color:var(--signal);color:#12181D;
  font-weight:600;
}
.variants button.obs[aria-current="true"]{background:var(--cyan);border-color:var(--cyan)}
.variants button:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
.meta{padding:0 1.1rem;font-family:var(--mono);font-size:.7rem;
      color:var(--dim);line-height:1.7}
.meta b{color:var(--ink);font-weight:500}
.note{
  margin:1.1rem 1.1rem 0;padding:.6rem .7rem;border:1px solid var(--signal-dim);
  border-left-width:3px;font-size:.7rem;line-height:1.5;color:#C9B189;
}

/* ---------- stage ---------- */
.stage{
  flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;
  padding:1rem 1.1rem .4rem;
}
.frame{
  flex:1;min-height:0;position:relative;display:flex;
  align-items:center;justify-content:center;
}
.frame img{
  max-width:100%;max-height:100%;image-rendering:auto;
  opacity:0;transition:opacity .12s linear;
}
.frame img.on{opacity:1}
.loading{
  position:absolute;font-family:var(--mono);font-size:.75rem;color:var(--dim);
  letter-spacing:.08em;
}
.cbar{height:2.6rem;display:flex;align-items:center;justify-content:center}
.cbar img{max-height:100%;max-width:34rem}

/* ---------- lead-time strip: the navigation IS the forecast cadence ---- */
.strip{
  border-top:1px solid var(--line);background:var(--panel);
  padding:.6rem 1.1rem .8rem;display:flex;align-items:center;gap:1rem;
}
.strip button.step{
  background:var(--panel-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:.95rem;line-height:1;cursor:pointer;
  width:2rem;height:2rem;border-radius:2px;flex-shrink:0;
}
.strip button.step:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
.strip button.step:disabled{opacity:.3;cursor:default}
.strip button.step:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
#play{width:auto;padding:0 .7rem;font-family:var(--cond);font-size:.72rem;
      font-weight:600;letter-spacing:.12em;text-transform:uppercase}

.ticks{flex:1;min-width:0}
.tickrow{display:flex;gap:2px;height:2.35rem}
.tick{
  flex:1;min-width:0;background:var(--panel-2);border:0;cursor:pointer;padding:0;
  border-bottom:3px solid var(--line);position:relative;
  font-family:var(--mono);font-size:.6rem;color:var(--dim);
}
.tick:hover{background:#22303B;color:var(--ink)}
.tick[aria-current="true"]{
  background:#2A3946;color:var(--signal);border-bottom-color:var(--signal);
}
.tick:focus-visible{outline:2px solid var(--signal);outline-offset:-2px}
.readout{
  flex-shrink:0;text-align:right;font-family:var(--mono);line-height:1.35;
}
.readout .lead{font-size:1.15rem;color:var(--signal);font-weight:600}
.readout .valid{font-size:.72rem;color:var(--dim)}

.badge{
  font-family:var(--cond);font-size:.62rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;padding:.2rem .45rem;border-radius:2px;
  border:1px solid var(--line);color:var(--dim);
}
.badge.ok{border-color:var(--cyan);color:var(--cyan)}
.badge.ens{border-color:var(--signal);color:var(--signal)}
.badge.stale{border-color:#7A3B3B;color:#D98080}
#agebar{
  display:flex;gap:.5rem;align-items:baseline;font-family:var(--mono);
  font-size:.68rem;color:var(--dim);padding:.35rem 1.1rem .2rem;
}
#agebar b{color:var(--ink);font-weight:500}
.skill{
  flex-shrink:0;display:flex;gap:.9rem;font-family:var(--mono);font-size:.7rem;
  padding:0 .3rem;border-left:1px solid var(--line);padding-left:.9rem;
}
.skill div{text-align:center;line-height:1.4}
.skill .k{color:var(--dim);font-size:.58rem;letter-spacing:.1em;
          text-transform:uppercase}
.skill .v{color:var(--ink);font-size:.9rem;font-weight:500}
.skill .v.na{color:var(--dim)}
#blink[aria-pressed="true"]{border-color:var(--cyan);color:var(--cyan)}
.obsflag{
  position:absolute;top:.4rem;left:.4rem;font-family:var(--cond);
  font-size:.68rem;font-weight:700;letter-spacing:.14em;color:var(--cyan);
  background:rgba(14,20,25,.75);padding:.15rem .45rem;border-radius:2px;
  display:none;
}
.obsflag.on{display:block}

@media (max-width:820px){
  main{flex-direction:column}
  aside{width:auto;max-height:12rem;border-right:0;border-bottom:1px solid var(--line)}
  .readout .lead{font-size:.95rem}
}
@media (prefers-reduced-motion:reduce){
  .frame img{transition:none}
}
</style>
</head>
<body>

<header>
  <h1>Storm<span>Scope</span> · Cape Canaveral</h1>
  <div class="sub" id="modelline">loading…</div>
  <span class="badge" id="kindbadge">—</span>
  <span class="badge" id="agebadge">—</span>
  <span class="badge" id="vbadge">unverified</span>
  <div class="spacer"></div>
  <label class="sub" for="runsel">RUN</label>
  <select id="runsel" aria-label="Initialization time"></select>
</header>

<main>
  <aside>
    <div class="eyebrow">Field</div>
    <ul class="varlist" id="varlist"></ul>
    <div class="eyebrow" id="varianthead" hidden>Member</div>
    <div class="variants" id="variants"></div>
    <div class="eyebrow">Run detail</div>
    <div class="meta" id="meta"></div>
    <div class="note" id="note"></div>
  </aside>

  <div class="stage">
    <div class="frame" id="frame">
      <div class="loading" id="loading">LOADING FRAMES…</div>
      <div class="obsflag" id="obsflag">Observed</div>
    </div>
    <div class="cbar"><img id="cbar" alt=""></div>
  </div>
</main>

<div class="strip">
  <button class="step" id="prev" title="Previous step (←)" aria-label="Previous step">◀</button>
  <button class="step" id="play" title="Play/pause (space)">Play</button>
  <button class="step" id="next" title="Next step (→)" aria-label="Next step">▶</button>
  <button class="step" id="blink" title="Hold to compare with observed (B)"
          aria-pressed="false" disabled>Obs</button>
  <div class="ticks"><div class="tickrow" id="ticks" role="tablist"
       aria-label="Forecast lead time"></div></div>
  <div class="skill" id="skill" hidden></div>
  <div class="readout">
    <div class="lead" id="leadout">—</div>
    <div class="valid" id="validout">—</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const state = {run:null, manifest:null, varId:null, k:0, imgs:[], timer:null,
               obsImgs:null, blink:false, groups:[], groupId:null,
               variant:null, index:[], newest:{}};

// Which observed field a forecast field should be compared against.
function obsPairFor(id){
  if(id.startsWith('obs_')) return null;
  if(id.includes('glm') || id.includes('lightning')) return 'obs_glm';
  if(id.includes('refc')) return 'obs_refc';
  return null;
}

async function boot(){
  let idx;
  try{
    idx = await (await fetch('runs/index.json?_=' + Date.now())).json();
  }catch(e){
    $('loading').textContent = 'No runs found. Export one with export_viewer.py, then push.';
    return;
  }
  if(!idx.runs || !idx.runs.length){
    $('loading').textContent = 'No runs yet. Run export_viewer.py and push.';
    return;
  }
  state.index = idx.runs;
  const newest = {};
  idx.runs.forEach(r => {
    const k = r.run_kind || (r.members > 1 ? 'ensemble' : 'deterministic');
    if(!newest[k]) newest[k] = r.slug;      // index is sorted newest first
  });
  state.newest = newest;

  $('runsel').innerHTML = idx.runs.map(r => {
    const k = r.run_kind || (r.members > 1 ? 'ensemble' : 'deterministic');
    const tag = r.slug === newest[k]
      ? (k === 'ensemble' ? '  ◀ LATEST ENS' : '  ◀ LATEST DET') : '';
    return `<option value="${r.slug}">${r.slug} · ${r.members} mem` +
           `${tag}</option>`;
  }).join('');
  $('runsel').onchange = e => loadRun(e.target.value);
  loadRun(idx.runs[0].slug);
}

function ago(iso){
  if(!iso) return null;
  const mins = (Date.now() - new Date(iso).getTime()) / 60000;
  if(mins < 0) return 'just now';
  if(mins < 90) return `${Math.round(mins)} min ago`;
  if(mins < 48*60) return `${(mins/60).toFixed(1)} h ago`;
  return `${Math.round(mins/1440)} d ago`;
}

async function loadRun(slug){
  stop();
  state.run = slug;
  $('loading').style.display = '';
  $('loading').textContent = 'LOADING MANIFEST…';
  const m = await (await fetch(`runs/${slug}/manifest.json?_=${Date.now()}`)).json();
  state.manifest = m;

  $('modelline').textContent =
    `${m.domain.nx}×${m.domain.ny} @ ${m.domain.grid_km} km · ` +
    `${m.members} member${m.members>1?'s':''} · ${m.leads.length} steps`;
  $('note').textContent = m.note || '';

  const kind = m.run_kind || (m.members > 1 ? 'ensemble' : 'deterministic');
  $('kindbadge').textContent = kind === 'ensemble'
    ? `${m.members}-member ensemble` : 'deterministic';
  $('kindbadge').classList.toggle('ens', kind === 'ensemble');

  // Is this the newest run of its own kind? That is the question a
  // forecaster actually has when several cadences are cycling at once.
  const isNewest = state.newest && state.newest[kind] === slug;
  const a = ago(m.run_completed);
  $('agebadge').textContent = a
    ? (isNewest ? `latest · ran ${a}` : `superseded · ran ${a}`)
    : 'run time unknown';
  $('agebadge').classList.toggle('stale', !isNewest);
  $('agebadge').title = m.run_completed
    ? `Computed at ${m.run_completed}\nInit data time ${m.init}`
    : '';

  const ver = m.verification;
  $('vbadge').textContent = ver ? 'verified' : 'awaiting obs';
  $('vbadge').classList.toggle('ok', !!ver);
  $('vbadge').title = ver
    ? `Scored ${ver.generated.slice(0,16).replace('T',' ')}Z · ` +
      `${ver.nep_mode.toUpperCase()} ${ver.neighborhood_km} km\n${ver.caveat}`
    : 'Observations have not been scored for this run yet.';

  const nb = m.neighborhood;
  $('meta').innerHTML = [
    `init <b>${m.init.slice(0,16).replace('T',' ')}Z</b>`,
    m.run_completed
      ? `ran  <b>${m.run_completed.slice(0,19).replace('T',' ')}Z</b>` : '',
    m.runtime_sec
      ? `took <b>${(m.runtime_sec/60).toFixed(1)} min</b>` : '',
    `type <b>${kind}</b>`,
    `satellite <b>${m.satellite || '—'}</b>`,
    `centre <b>${m.domain.center_lat.toFixed(3)}, ${m.domain.center_lon.toFixed(3)}</b>`,
    `refc thresh <b>${m.thresholds.refc_dbz} dBZ</b>`,
    `glm thresh <b>${m.thresholds.glm}</b>`,
    nb ? `neighborhood <b>${nb.mode.toUpperCase()} ${nb.radius_km} km</b>` : '',
    `exported <b>${m.generated.slice(0,16).replace('T',' ')}Z</b>`
  ].filter(Boolean).join('<br>');

  // Group the flat variable list into field -> variants (mean/max/mN/obs).
  state.groups = [];
  m.variables.forEach(v => {
    const gid = v.group || v.id;
    let g = state.groups.find(x => x.id === gid);
    if(!g){
      g = {id:gid, label:v.group_label || v.label, items:[]};
      state.groups.push(g);
    }
    g.items.push(v);
  });
  const ORDER = {mean:0, max:1, prob:2, obs:99};
  const rank = v => (ORDER[v.variant] !== undefined ? ORDER[v.variant]
                     : 10 + parseInt((v.variant||'m0').slice(1) || 0, 10));
  state.groups.forEach(g => g.items.sort((a,b) => rank(a) - rank(b)));

  $('varlist').innerHTML = state.groups.map(g =>
    `<li><button data-group="${g.id}">${g.label}</button></li>`).join('');
  $('varlist').querySelectorAll('button').forEach(b =>
    b.onclick = () => selectGroup(b.dataset.group));

  $('ticks').innerHTML = m.leads.map((l,i) =>
    `<button class="tick" role="tab" data-k="${i}" title="Valid ${l.valid}">${l.minutes}</button>`
  ).join('');
  $('ticks').querySelectorAll('.tick').forEach(t =>
    t.onclick = () => show(+t.dataset.k));

  state.blink = false;
  $('blink').setAttribute('aria-pressed','false');
  selectGroup(state.groups[0].id);
}

function selectGroup(gid, keepVariant){
  const g = state.groups.find(x => x.id === gid);
  if(!g) return;
  state.groupId = gid;
  $('varlist').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.group === gid ? 'true' : 'false'));

  // Keep the same variant when switching fields, if it exists there.
  let pick = keepVariant && g.items.find(v => v.variant === keepVariant);
  if(!pick) pick = g.items[0];

  const multi = g.items.length > 1;
  $('varianthead').hidden = !multi;
  $('variants').innerHTML = !multi ? '' : g.items.map(v =>
    `<button data-var="${v.id}" data-variant="${v.variant}"` +
    `${v.variant==='obs'?' class="obs"':''}` +
    ` title="${v.label}">${v.variant_label || v.variant}</button>`).join('');
  $('variants').querySelectorAll('button').forEach(b =>
    b.onclick = () => selectVar(b.dataset.var));

  selectVar(pick.id);
}

function currentGroup(){
  return state.groups.find(g => g.id === state.groupId);
}

function stepVariant(d){
  const g = currentGroup();
  if(!g || g.items.length < 2) return;
  const i = g.items.findIndex(v => v.id === state.varId);
  selectVar(g.items[(i + d + g.items.length) % g.items.length].id);
}

function selectVar(id){
  stop();
  const v = state.manifest.variables.find(x => x.id === id);
  if(!v) return;
  state.varId = id;
  state.variant = v.variant;
  $('variants').querySelectorAll('button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.var === id ? 'true' : 'false'));
  $('cbar').src = `runs/${state.run}/${v.colorbar}`;
  $('cbar').alt = `Colour scale: ${v.label}`;

  // Pair with the matching observed field, if it has been published.
  const pairId = obsPairFor(id);
  const pair = pairId && state.manifest.variables.find(x => x.id === pairId);
  $('blink').disabled = !pair;
  if(!pair){ state.blink = false; $('blink').setAttribute('aria-pressed','false'); }

  // Preload every frame, then swap by opacity so stepping never flickers.
  $('frame').querySelectorAll('img').forEach(n => n.remove());
  $('loading').style.display = '';
  $('loading').textContent = 'LOADING FRAMES…';
  let pending = v.frames.length + (pair ? pair.frames.length : 0);
  state.imgs = v.frames.map((f,i) => {
    const img = new Image();
    img.alt = `${v.label}, ${state.manifest.leads[i].valid}`;
    img.onload = img.onerror = () => {
      if(--pending === 0){ $('loading').style.display='none'; show(state.k); }
    };
    img.src = `runs/${state.run}/${f}`;
    $('frame').appendChild(img);
    return img;
  });

  state.obsImgs = !pair ? null : pair.frames.map((f,i) => {
    const img = new Image();
    img.alt = `${pair.label}, ${state.manifest.leads[i].valid}`;
    img.onload = img.onerror = () => {
      if(--pending === 0){ $('loading').style.display='none'; show(state.k); }
    };
    img.src = `runs/${state.run}/${f}`;
    $('frame').appendChild(img);
    return img;
  });
}

function fmtSkill(v, digits){
  return (v === null || v === undefined) ? '—' : v.toFixed(digits);
}

function renderSkill(){
  const ver = state.manifest.verification;
  const box = $('skill');
  if(!ver){ box.hidden = true; return; }
  const r = ver.leads[state.k] || {};
  const cells = [
    ['FSS refc', r.fss_refc, 2],
    ['FSS glm',  r.fss_glm,  2],
    ['CSI',      r.csi,      2],
    ['Brier',    r.brier_refc, 3],
  ];
  box.innerHTML = cells.map(([k,v,d]) =>
    `<div><div class="k">${k}</div>` +
    `<div class="v${v==null?' na':''}">${fmtSkill(v,d)}</div></div>`).join('');
  box.hidden = false;
}

function show(k){
  const n = state.manifest.leads.length;
  state.k = ((k % n) + n) % n;
  const useObs = state.blink && state.obsImgs;
  state.imgs.forEach((im,i) => im.classList.toggle('on', !useObs && i === state.k));
  if(state.obsImgs)
    state.obsImgs.forEach((im,i) => im.classList.toggle('on', useObs && i === state.k));
  $('obsflag').classList.toggle('on', !!useObs);
  $('ticks').querySelectorAll('.tick').forEach((t,i) =>
    t.setAttribute('aria-current', i === state.k ? 'true' : 'false'));
  const l = state.manifest.leads[state.k];
  $('leadout').textContent = `F+${String(l.minutes).padStart(3,'0')}m`;
  $('validout').textContent = l.valid;
  $('prev').disabled = false; $('next').disabled = false;
  renderSkill();
}

function toggleBlink(){
  if(!state.obsImgs) return;
  state.blink = !state.blink;
  $('blink').setAttribute('aria-pressed', state.blink ? 'true' : 'false');
  show(state.k);
}

function stop(){
  if(state.timer){ clearInterval(state.timer); state.timer = null; }
  $('play').textContent = 'Play';
}
function toggle(){
  if(state.timer){ stop(); return; }
  $('play').textContent = 'Stop';
  state.timer = setInterval(() => show(state.k + 1), 450);
}

$('prev').onclick = () => { stop(); show(state.k - 1); };
$('next').onclick = () => { stop(); show(state.k + 1); };
$('play').onclick = toggle;
$('blink').onclick = toggleBlink;

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'SELECT') return;
  if(e.key === 'ArrowLeft'){ stop(); show(state.k - 1); e.preventDefault(); }
  else if(e.key === 'ArrowRight'){ stop(); show(state.k + 1); e.preventDefault(); }
  else if(e.key === 'Home'){ stop(); show(0); e.preventDefault(); }
  else if(e.key === 'End'){ stop(); show(state.manifest.leads.length-1); e.preventDefault(); }
  else if(e.key === ' '){ toggle(); e.preventDefault(); }
  else if(e.key === 'b' || e.key === 'B'){ toggleBlink(); e.preventDefault(); }
  else if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    const gs = state.groups;
    const i = gs.findIndex(g => g.id === state.groupId);
    selectGroup(gs[(i + (e.key==='ArrowDown'?1:gs.length-1)) % gs.length].id,
                state.variant);
    e.preventDefault();
  }
  else if(e.key === '[' ){ stepVariant(-1); e.preventDefault(); }
  else if(e.key === ']' ){ stepVariant(1);  e.preventDefault(); }
});

boot();
</script>
